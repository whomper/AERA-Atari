name: Rig tools

# The measuring programs Erez runs on his own Atari for the test rigs
# (common/tests/calib: CALIB.PRG, what a file call costs on his disk).
# Only formal releases leave the build machine: run this workflow on main
# with a tag (rigtools-1, rigtools-2, ... never reused) and the notes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. rigtools-1 (never reuse a number)"
        required: true
      notes:
        description: "Release notes (what to run, what to send back)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The cross compiler
        run: |
          echo https://mirrors.edge.kernel.org/ubuntu | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y gcc-m68k-linux-gnu
      - name: Build calib.prg
        run: |
          make -C common/tests/calib
          mkdir -p dist
          cp common/tests/calib/build/CALIB.PRG dist/calib.prg
          cd dist && zip -9 rigtools.zip calib.prg
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG exists: never reuse a number"; exit 1; fi
          gh release create "$TAG" dist/calib.prg dist/rigtools.zip --title "Rig tools $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
